[project]
name = "backend"
version = "0.1.0"
description = "FastAPI asynchronous backend for content creation and multi-platform publishing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "bcrypt>=4.0.0",
    "beanie>=2.2.0",
    "cryptography>=42.0.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "gtts>=2.5.0",
    "httpx>=0.28.1",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "motor>=3.7.1",
    "moviepy>=1.0.3",
    "pillow>=10.0.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.vercel]
entrypoint = "main:app"

